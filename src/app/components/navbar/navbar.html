<div class="topbar" [class.hide]="scrolled">
  <div class="container d-flex justify-content-between align-items-center">
    <span><i class="bi bi-megaphone-fill me-2"></i>Inscripciones abiertas: matricúlate al 1er ciclo de inglés</span>
    <div class="topbar-links d-none d-lg-flex">
      @for (l of topLinks; track l.label) {
        <a [href]="l.href" target="_blank" rel="noopener">{{ l.label }}</a>
      }
    </div>
  </div>
</div>

<nav class="cic-nav" [class.scrolled]="scrolled">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="brand" href="#inicio">
      <span class="brand-mark">CIC</span>
      <span class="brand-text">
        <strong>Centro de Idiomas</strong>
        <small>Universidad Continental</small>
      </span>
    </a>

    <button class="nav-toggle d-xl-none" type="button" aria-label="Abrir menú" (click)="open = !open">
      <i class="bi" [class.bi-list]="!open" [class.bi-x-lg]="open"></i>
    </button>

    <div class="nav-menu" [class.open]="open">
      <ul>
        @for (l of links; track l.label) {
          <li><a [href]="l.href" (click)="open = false">{{ l.label }}</a></li>
        }
      </ul>
      <a class="btn-brand" href="https://estudiantesidiomas.continental.edu.pe/login" target="_blank" rel="noopener">
        Matricúlate <i class="bi bi-arrow-right"></i>
      </a>
    </div>
  </div>
</nav>
