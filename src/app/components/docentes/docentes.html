<section id="docentes" class="section section-soft">
  <div class="container">
    <div class="section-head d-md-flex justify-content-between align-items-end">
      <div>
        <span class="eyebrow">Nuestros docentes</span>
        <h2 class="section-title">Equipo altamente calificado</h2>
        <p class="section-sub">Especialistas por idioma, con formación y certificaciones internacionales.</p>
      </div>
      <a class="btn-ghost mt-3 mt-md-0" href="https://idiomas.ucontinental.edu.pe/nuestros-docentes/" target="_blank" rel="noopener">
        Ver todos <i class="bi bi-arrow-right"></i>
      </a>
    </div>

    <div class="row g-4">
      @for (d of docentes; track d.nombre) {
        <div class="col-sm-6 col-lg-3">
          <article class="card-cic docente">
            <div class="avatar">{{ d.iniciales }}</div>
            <h3>{{ d.nombre }}</h3>
            <p class="esp">{{ d.especialidad }}</p>
            <div class="idiomas">
              @for (i of d.idiomas; track i) { <span class="tag">{{ i }}</span> }
            </div>
            <small><i class="bi bi-patch-check-fill"></i> {{ d.experiencia }}</small>
          </article>
        </div>
      }
    </div>
  </div>
</section>
